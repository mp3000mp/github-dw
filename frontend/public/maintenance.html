<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <title>github-finder - maintenance</title>
  <!-- Served by apache (503) while deployment/ansible deploys: keep it self-contained, no app assets. -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, sans-serif; background: #f6f8fa; color: #24292f; }
    main { text-align: center; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { margin: 0; color: #57606a; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      p { color: #8b949e; }
    }
  </style>
</head>
<body>
  <main>
    <h1>github-finder is being updated</h1>
    <p>We'll be back in a few minutes.</p>
