- name: Rsync backend directories
  ansible.posix.synchronize:
    delete: true
    src: '{{ playbook_dir }}/../../backend/{{ item }}'
    dest: "{{ app_directory }}/backend/"
    recursive: true
    rsync_opts:
      - "--chown={{ maintainer_user }}:{{ maintainer_user }}"
      - '--chmod=0750'
      # dev only: phpunit runner, and the gitignored IDE-only config dump regenerated on cache warmup
      - '--exclude=/bin/phpunit'
      - '--exclude=/config/reference.php'
  loop:
    - 'bin'
    - 'config'
    - 'migrations'
    - 'public'
    - 'resources'
    - 'src'
    - 'templates'
    - 'translations'

# Built without dev dependencies by local_build.sh (the local backend/vendor/ keeps them).
- name: Rsync backend vendor
  ansible.posix.synchronize:
    delete: true
    src: '{{ playbook_dir }}/.build/backend/vendor'
    dest: "{{ app_directory }}/backend/"
    recursive: true
    rsync_opts:
      - "--chown={{ maintainer_user }}:{{ maintainer_user }}"
      - '--chmod=0750'

# Excluded files are left in place by --delete: clean up those sent by earlier deploys.
- name: Remove dev only backend files
  file:
    path: "{{ app_directory }}/backend/{{ item }}"
    state: absent
  loop:
    - 'bin/phpunit'
    - 'config/reference.php'

- name: Deploy backend files
  copy:
    src: '{{ playbook_dir }}/../../backend/{{ item }}'
    dest: "{{ app_directory }}/backend/"
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '640'
  loop:
    - '.env'
    - 'composer.json'
    - 'composer.lock'
    - 'symfony.lock'

- name: Create backend .env.local
  template:
    src: templates/.env.j2
    dest: "{{ app_directory }}/backend/.env.local"
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '640'

- name: Create backend directories
  file:
    path: "{{ app_directory }}/backend/{{ item }}"
    state: directory
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '750'
  loop:
    - 'var'
    - 'var/log'
    - 'var/cache'
