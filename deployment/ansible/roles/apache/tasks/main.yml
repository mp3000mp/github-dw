- name: Enable apache modules
  command: "a2enmod {{ item }}"
  args:
    creates: "/etc/apache2/mods-enabled/{{ item }}.load"
  loop:
    - headers
    - proxy
    - proxy_http
    - rewrite
    - ssl
  notify: reload apache

# The front vhost logs there: apache refuses to reload if the directory is missing.
- name: Ensure frontend log directory exists
  file:
    path: "{{ app_directory }}/frontend/log"
    state: directory
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '755'

- name: Install frontend vhost (HTTP)
  template:
    src: vhost_front.conf.j2
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}.conf"
    owner: root
    group: root
    mode: '644'
  notify: reload apache

- name: Install backend vhost (HTTP)
  template:
    src: vhost_back.conf.j2
    dest: "/etc/apache2/sites-available/{{ backend_server_name }}.conf"
    owner: root
    group: root
    mode: '644'
  notify: reload apache

- name: Enable HTTP vhosts
  command: "a2ensite {{ item }}"
  args:
    creates: "/etc/apache2/sites-enabled/{{ item }}.conf"
  loop:
    - "{{ frontend_server_name }}"
    - "{{ backend_server_name }}"
  notify: reload apache

# Reload now so certbot --apache can find a running vhost on port 80
# for the ACME http-01 challenge before we deploy the HTTPS vhosts.
- name: Reload apache before certbot
  meta: flush_handlers

# certonly: certbot only fetches the certificate and never rewrites the vhosts managed below.
- name: Obtain Let's Encrypt certificates
  command: >-
    certbot certonly --apache
    -d {{ item }}
    --non-interactive --agree-tos
    -m {{ admin_email }}
  args:
    creates: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  loop:
    - "{{ frontend_server_name }}"
    - "{{ backend_server_name }}"

- name: Install frontend vhost (HTTPS)
  template:
    src: vhost_front-le-ssl.conf.j2
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}-le-ssl.conf"
    owner: root
    group: root
    mode: '644'
  notify: reload apache

- name: Install backend vhost (HTTPS)
  template:
    src: vhost_back-le-ssl.conf.j2
    dest: "/etc/apache2/sites-available/{{ backend_server_name }}-le-ssl.conf"
    owner: root
    group: root
    mode: '644'
  notify: reload apache

- name: Enable HTTPS vhosts
  command: "a2ensite {{ item }}"
  args:
    creates: "/etc/apache2/sites-enabled/{{ item }}.conf"
  loop:
    - "{{ frontend_server_name }}-le-ssl"
    - "{{ backend_server_name }}-le-ssl"
  notify: reload apache
