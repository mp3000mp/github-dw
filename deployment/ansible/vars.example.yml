admin_email: me@me.fr

app_directory: /var/www/app
maintainer_user: user1

# Docker compose project name — changing it on a running server recreates every container under the new name.
compose_project_name: ghf

# Site state AFTER deploy (true = stays closed to the public); the deploy window always goes to maintenance.
maintenance_mode: false

# MariaDB server version — must match the mariadb image tag (roles/docker/templates/docker-compose.yml.j2); used in Doctrine's DATABASE_URL.
mysql_version: 11.4.5
mysql_root_password: root_pwd
mysql_database: template_sf
mysql_user: user
mysql_password: user_pwd

github_api_key: key
dw_version: 1.0.0

backend_server_name: template-back.mp3000.fr
frontend_server_name: template.mp3000.fr
back_proxy_port: 5000

app_version: 1.0.0
app_secret: secret

backup_key: secret
backup_remote_host: remote
backup_remote_directory: /tmp
